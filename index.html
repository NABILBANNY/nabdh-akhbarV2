const PC = {SA:"#2DD4BF",EG:"#F59E0B",AE:"#818CF8",MA:"#F87171",TN:"#34D399",DZ:"#FB923C",QA:"#E879F9",KW:"#4ADE80",IQ:"#60A5FA",LY:"#A78BFA",INTL:"var(--txt-m)"};
function hc(c){let h=0;for(let i=0;i<c.length;i++)h=c.charCodeAt(i)+((h<<5)-h);return`hsl(${Math.abs(h)%360},70%,65%)`;}
function rgba(hex,a){
  if(hex.startsWith("hsl"))return hex.replace("hsl(","hsla(").replace(")",`,${a})`);
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}
function gc(code){const accent=PC[code]||hc(code||"XX");return{accent,bg:rgba(accent,.08),border:rgba(accent,.3)};}
const CATI = {
  اقتصاد: "📈",
  تقنية: "💡",
  سياسة: "🏛️",
  مجتمع: "👨‍👩‍👦‍👦",
  صحة: "🏥",
  ثقافة: "🎭",
  عام: "📰",
};

// ══════════════════════════════════════════════
//  UNIVERSAL N8N PARSER
// ══════════════════════════════════════════════
function parseN8NResponse(data){
  if(!data) return null;
  if(Array.isArray(data) && data.length > 0){
    if(data[0]?.json !== undefined) return data.map(i => i.json);
    return data;
  }
  if(typeof data === "object" && data !== null){
    const arr = data.items || data.data || data.news || data.analyses || data.results || data.content;
    if(Array.isArray(arr) && arr.length > 0) return arr;
    if(data.id !== undefined) return [data];
    if(data.json) return Array.isArray(data.json) ? data.json : [data.json];
  }
  return null;
}

async function fetchNews(url){
  if(!url||url.includes("your-app")) return MOCK_NEWS;
  try{
    const res=await fetch(url,{method:"GET",headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const parsed=parseN8NResponse(await res.json());
    return parsed&&parsed.length>0?parsed:MOCK_NEWS;
  }catch(e){ console.warn("fetchNews →",e.message); return MOCK_NEWS; }
}
async function fetchAnalyses(url){
  if(!url||url.includes("your-app")) return MOCK_ANALYSES;
  try{
    const res=await fetch(url,{method:"GET",headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const parsed=parseN8NResponse(await res.json());
    return parsed&&parsed.length>0?parsed:MOCK_ANALYSES;
  }catch(e){ console.warn("fetchAnalyses →",e.message); return MOCK_ANALYSES; }
}

async function genComment(title,summary){
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
        system:"أنت محلل إخباري عربي متخصص. قدّم تعليقاً تحليلياً موجزاً (3-4 جمل) موضوعياً بلغة عربية فصيحة. أجب مباشرةً بالتعليق فقط.",
        messages:[{role:"user",content:`العنوان: ${title}\nالملخص: ${summary}`}]}),
    });
    const d=await res.json();return d.content?.[0]?.text||"تعذّر توليد التعليق.";
  }catch(e){return"تعذّر الاتصال بمحرك التحليل.";}
}

const MOCK_PENDING = [];

function ReviewScreen({wh3,wh4,dark,onBack}){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [sendingId,setSendingId]=useState(null);
  const [doneIds,setDoneIds]=useState({});

  const V={
    bg:"var(--bg-card)",bgInput:"var(--bg-input)",
    border:"var(--border)",border2:"var(--border2)",
    chip:"var(--bg-chip)",
    h:"var(--txt-p)",m:"var(--txt-m)",d:"var(--txt-d)",
  };

  const load=async(silent=false)=>{
    if(!silent) setLoading(true);
    try{
      if(!wh3||wh3.includes("your-app")){
        setItems(prev=>{
          const existingIds=new Set(prev.map(i=>i.id));
          const newItems=MOCK_PENDING.filter(i=>!existingIds.has(i.id));
          return [...prev, ...newItems];
        });
        setLoading(false);
        return;
      }
      const res=await fetch(wh3,{method:"GET",headers:{"Accept":"application/json"}});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const raw=await res.json();
      const parsed=parseN8NResponse(raw);
      if(parsed&&parsed.length>0){
        const mappedItems = parsed.map(item => ({
          id: item.id || `pending-${Math.random()}`,
          type: item.type || "news",
          country: item.country || "عام",
          countryCode: item.countryCode || "INTL",
          flag: item.flag || "🌍",
          category: item.category || "عام",
          title: item.title || "",
          body: item.body || "",
          summary: item.summary || item.body || "",
          analysis: item.analysis || item.Analyse || "",
          source: item.source || item.author || "مصدر غير معروف",
          author: item.author || "",
          readTime: item.readTime || "3 دقائق",
          publishedAt: item.publishedAt || new Date().toISOString(),
          tags: typeof item.tags === "string" ? JSON.parse(item.tags) : (item.tags || []),
          image: item.image || "",
          urgent: item.urgent ?? false,
          validation: item.validation ?? item["Sent Validation"] ?? item["Validation"] ?? null,
        }));
        setItems(prev=>{
          const doneSet=new Set(Object.keys(doneIds));
          const existingIds=new Set(prev.map(i=>i.id));
          const kept=prev.filter(i=>!doneSet.has(i.id));
          const incoming=mappedItems.filter(i=>!existingIds.has(i.id)&&!doneSet.has(i.id));
          return [...kept,...incoming];
        });
      }
    }catch(e){
      console.warn("ReviewScreen load error:",e.message);
      if(!silent) setItems(prev=>prev.length>0?prev:MOCK_PENDING);
    }
    if(!silent) setLoading(false);
  };

  useEffect(()=>{load();},[]);

  const sendDecision=async(item,approved)=>{
    setSendingId(item.id+(approved?"true":"false"));
    const payload={
      id: item.id,
      type: item.type,
      validation: approved,
      validated_at: new Date().toISOString(),
      content:{
        title: item.title || null,
        body: item.body || null,
        summary: item.summary || null,
        analysis: item.analysis || null,
        category: item.category || null,
        urgent: item.urgent ?? false,
        source: item.source || null,
        author: item.author || null,
        readTime: item.readTime || null,
        tags: item.tags || [],
        image: item.image || null,
        country: item.country || null,
        countryCode: item.countryCode || null,
        flag: item.flag || null,
      }
    };

    try{
      const actionUrl=wh4&&!wh4.includes("your-app")?wh4:null;
      if(actionUrl){
        await fetch(actionUrl,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });
      }
      setDoneIds(prev=>({...prev,[item.id]:approved?"approved":"rejected"}));
      setItems(prev=>prev.filter(i=>i.id!==item.id));
    }catch(e){
      console.error("sendDecision error:",e);
      alert("تعذر إرسال القرار إلى n8n");
    }finally{
      setSendingId(null);
    }
  };

  const updateField = (id, field, value) => {
    setItems(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
  };

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"14px 20px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={onBack} style={{background:V.chip,border:"none",cursor:"pointer",color:V.m,fontSize:18,width:34,height:34,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div>
            <div style={{color:V.h,fontWeight:800,fontSize:16}}>مراجعة المحتوى</div>
            <div style={{color:"#F59E0B",fontSize:10.5,fontWeight:700}}>Workflow 3 · n8n</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{background:"rgba(245,158,11,.12)",border:"1px solid rgba(245,158,11,.3)",borderRadius:12,padding:"4px 10px"}}>
            <span style={{color:"#F59E0B",fontSize:11,fontWeight:700}}>{items.length} بانتظار الموافقة</span>
          </div>
          <button onClick={()=>load()} disabled={loading} style={{background:"none",border:"none",cursor:"pointer",color:"#F59E0B",fontSize:22,opacity:loading?0.5:1}}>⟳</button>
        </div>
      </div>

      <div style={{overflowY:"auto",flex:1,padding:"0 20px 20px"}}>
        {loading?(
          <div style={{textAlign:"center",padding:"40px 0",color:V.m}}>جاري تحميل المحتوى للمراجعة...</div>
        ):items.length===0?(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"60px 20px",gap:12}}>
            <div style={{fontSize:48}}>🎉</div>
            <div style={{color:V.h,fontSize:15,fontWeight:700}}>لا يوجد محتوى قيد المراجعة</div>
            <div style={{color:V.d,fontSize:13,textAlign:"center"}}>تمت مراجعة جميع الأخبار والمقالات الواردة من n8n.</div>
          </div>
        ):(
          items.map(item=>{
            const isEditing = editingId === item.id;
            const col = gc(item.countryCode);
            return(
              <div key={item.id} style={{background:V.bg,border:`1px solid ${V.border}`,borderRadius:18,padding:16,marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <span style={{background:col.bg,color:col.accent,fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,border:`1px solid ${col.border}`}}>{item.flag} {item.country}</span>
                    <span style={{background:V.chip,color:V.m,fontSize:11,padding:"2px 8px",borderRadius:20}}>{item.type === "article" ? "🏛️ مقال تحليلي" : "📰 خبر"}</span>
                    {item.urgent && <span style={{background:"#DC2626",color:"#fff",fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:20}}>⚡ عاجل</span>}
                  </div>
                  <button onClick={()=>setEditingId(isEditing ? null : item.id)} style={{background:"rgba(37,99,235,.12)",border:"1px solid rgba(37,99,235,.3)",color:"#60A5FA",borderRadius:8,padding:"4px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                    {isEditing ? "حفظ التعديلات ✏️" : "تعديل النص ✏️"}
                  </button>
                </div>

                {isEditing ? (
                  <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:12,maxHeight:"380px",overflowY:"auto",paddingRight:4,paddingLeft:4}}>
                    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:2}}>
                      <button onClick={()=>updateField(item.id,"type",item.type==="article"?"news":"article")}
                        style={{background:item.type==="article"?"rgba(124,58,237,.2)":V.chip,border:`1px solid ${item.type==="article"?"#7C3AED":V.border2}`,color:item.type==="article"?"#A78BFA":V.m,borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                        {item.type === "article" ? "🏛️ مقال تحليلي" : "📰 خبر"}
                      </button>
                      <button onClick={()=>updateField(item.id,"urgent",!item.urgent)}
                        style={{background:item.urgent?"#DC2626":V.chip,border:`1px solid ${item.urgent?"#DC2626":V.border2}`,color:item.urgent?"#fff":V.m,borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                        {item.urgent ? "⚡ عاجل (مُفعّل)" : "⚡ غير عاجل"}
                      </button>
                    </div>

                    <div>
                      <div style={{color:V.m,fontSize:11,fontWeight:700,marginBottom:4}}>العنوان</div>
                      <input value={item.title||""} onChange={e => updateField(item.id, "title", e.target.value)} placeholder="العنوان" style={{width:"100%",background:V.bgInput,border:`1px solid ${V.border2}`,borderRadius:8,padding:"8px 10px",color:V.h,fontSize:13,fontFamily:"inherit",outline:"none",boxSizing:"border-box",direction:"rtl"}} />
                    </div>

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                      <div>
                        <div style={{color:V.m,fontSize:11,fontWeight:700,marginBottom:4}}>القسم</div>
                        <input value={item.category||""} onChange={e => updateField(item.id, "category", e.target.value)} placeholder="مثال: اقتصاد" style={{width:"100%",background:V.bgInput,border:`1px solid ${V.border2}`,borderRadius:8,padding:"8px 10px",color:V.h,fontSize:12,fontFamily:"inherit",outline:"none",boxSizing:"border-box",direction:"rtl"}} />
                      </div>
                      <div>
                        <div style={{color:V.m,fontSize:11,fontWeight:700,marginBottom:4}}>وقت القراءة</div>
                        <input value={item.readTime||""} onChange={e => updateField(item.id, "readTime", e.target.value)} placeholder="مثال: 5 دقائق" style={{width:"100%",background:V.bgInput,border:`1px solid ${V.border2}`,borderRadius:8,padding:"8px 10px",color:V.h,fontSize:12,fontFamily:"inherit",outline:"none",boxSizing:"border-box",direction:"rtl"}} />
                      </div>
                    </div>

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                      <div>
                        <div style={{color:V.m,fontSize:11,fontWeight:700,marginBottom:4}}>المصدر</div>

                    </div>

                    <div>
                      <div style={{color:V.m,fontSize:11,fontWeight:700,marginBottom:4}}>المحتوى الكامل / النص الأصلي</div>
                      <textarea value={item.body||""} onChange={e => updateField(item.id, "body", e.target.value)} placeholder="النص الأصلي" style={{width:"100%",minHeight:80,background:V.bgInput,border:`1px solid ${V.border2}`,borderRadius:8,padding:"8px 10px",color:V.h,fontSize:12.5,fontFamily:"inherit",outline:"none",boxSizing:"border-box",direction:"rtl",resize:"none"}} />
                    </div>

                    <div>
                      <div style={{color:col.accent,fontSize:11,fontWeight:700,marginBottom:4}}>التحليل السياسي</div>
                      <textarea value={item.analysis||""} onChange={e => updateField(item.id, "analysis", e.target.value)} placeholder="التحليل السياسي" style={{width:"100%",minHeight:70,background:V.bgInput,border:`1px solid ${V.border2}`,borderRadius:8,padding:"8px 10px",color:col.accent,fontSize:12.5,fontFamily:"inherit",outline:"none",boxSizing:"border-box",direction:"rtl",resize:"none"}} />

                      <div>
                        <div style={{color:V.m,fontSize:11,fontWeight:700,marginBottom:4}}>الوسوم</div>
                        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>

                        </div>
                      </div>
                    )}

                    {item.analysis && (
                      <div>
                        <div style={{color:col.accent,fontSize:11,fontWeight:700,marginBottom:4}}>🤖 التحليل السياسي المخزّن</div>
                        <div style={{maxHeight:120,overflowY:"auto",background:col.bg,border:`1px solid ${col.border}`,borderRadius:8,padding:"8px 10px",color:V.m,fontSize:12.5,lineHeight:1.6}}>
                          {item.analysis}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                <div style={{display:"flex",gap:10,marginTop:12}}>
                  <button onClick={() => sendDecision(item, true)} disabled={sendingId !== null} style={{flex:1,padding:"10px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#22C55E,#16A34A)",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",opacity:sendingId === item.id + "true" ? 0.6 : 1}}>
                    {sendingId === item.id + "true" ? "جاري الإرسال..." : "موافقة ونشر ✅"}
                  </button>
                  <button onClick={() => sendDecision(item, false)} disabled={sendingId !== null} style={{flex:1,padding:"10px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#EF4444,#DC2626)",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",opacity:sendingId === item.id + "false" ? 0.6 : 1}}>
                    {sendingId === item.id + "false" ? "جاري الإرسال..." : "رفض ❌"}
                  </button>
                </div>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

function App(){
  const [tab, setTab] = useState("home");
  const [news, setNews] = useState(MOCK_NEWS);
  const [analyses, setAnalyses] = useState(MOCK_ANALYSES);
  const [loadingNews, setLoadingNews] = useState(false);
  const [loadingAnalyses, setLoadingAnalyses] = useState(false);

  const [wh1, setWh1] = useState(() => localStorage.getItem("wh1") || "https://your-n8n-instance.com/webhook/news");
  const [wh2, setWh2] = useState(() => localStorage.getItem("wh2") || "https://your-n8n-instance.com/webhook/analyses");
  const [wh3, setWh3] = useState(() => localStorage.getItem("wh3") || "https://your-n8n-instance.com/webhook/review");
  const [wh4, setWh4] = useState(() => localStorage.getItem("wh4") || "https://your-n8n-instance.com/webhook/review-action");

  const [ri, setRi] = useState(300);
  const [dark, setDark] = useState(true);
  const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem("isAdmin") === "1");

  const [savedNews, setSavedNews] = useState(() => new Set());
  const [savedItems, setSavedItems] = useState([]);
  const [openedNews, setOpenedNews] = useState(null);
  const [activeCountryNews, setActiveCountryNews] = useState("الكل");

  const [lastUpdateNews, setLastUpdateNews] = useState(new Date());
  const [lastUpdateAnalyses, setLastUpdateAnalyses] = useState(new Date());

  const refreshNews = useCallback(async () => {
    setLoadingNews(true);
    const data = await fetchNews(wh1);
    setNews(data);
    setLastUpdateNews(new Date());
    setLoadingNews(false);
  }, [wh1]);

  const refreshAnalyses = useCallback(async () => {
    setLoadingAnalyses(true);
    const data = await fetchAnalyses(wh2);
    setAnalyses(data);
    setLastUpdateAnalyses(new Date());
    setLoadingAnalyses(false);
  }, [wh2]);

  useEffect(() => {
    refreshNews();
    refreshAnalyses();
  }, [refreshNews, refreshAnalyses]);

  useEffect(() => {
    if (dark) {
      document.documentElement.classList.remove("light");
    } else {
      document.documentElement.classList.add("light");
    }
  }, [dark]);

  useEffect(() => {
    const interval = setInterval(() => {
      refreshNews();
      refreshAnalyses();
    }, ri * 1000);
    return () => clearInterval(interval);
  }, [ri, refreshNews, refreshAnalyses]);

  const toggleSave = (item) => {
    setSavedNews(prev => {
      const next = new Set(prev);
      if (next.has(item.id)) {
        next.delete(item.id);
        setSavedItems(s => s.filter(x => x.id !== item.id));
      } else {
        next.add(item.id);
        setSavedItems(s => [item, ...s]);
      }
      return next;
    });
  };

  const urgentCount = news.filter(n => n.urgent).length;

  return (
    <div style={{
      width:"100%", maxWidth:480, height:"100vh", maxHeight:900,
      background:"var(--bg-shell)", border:"1px solid var(--border)",
      borderRadius:24, display:"flex", flexDirection:"column",
      position:"relative", overflow:"hidden", boxShadow:"0 20px 50px var(--shadow)"
    }}>
      <StatusBar />

      <div style={{flex:1, display:"flex", flexDirection:"column", overflow:"hidden", position:"relative"}}>
        {tab === "home" && (
          <HomeScreen
            news={news} loading={loadingNews} onRefresh={refreshNews}
            lastUpdate={lastUpdateNews} savedIds={savedNews} onSave={toggleSave}
            onOpen={setOpenedNews} activeCountry={activeCountryNews} setActive={setActiveCountryNews}
          />
        )}
        {tab === "analyse" && (
          <AnalysesScreen
            analyses={analyses} loading={loadingAnalyses} onRefresh={refreshAnalyses}
            lastUpdate={lastUpdateAnalyses}
          />
        )}
        {tab === "notifications" && (
          <NotificationsScreen news={news} onBack={() => setTab("home")} />
        )}
        {tab === "saved" && (
          <SavedScreen
            saved={savedItems}
            onUnsave={(id) => toggleSave({id})}
            onOpen={setOpenedNews}
            onBack={() => setTab("home")}
          />
        )}
        {tab === "settings" && (
          <SettingsScreen
            onBack={() => setTab("home")}
            wh1={wh1} setWh1={setWh1}
            wh2={wh2} setWh2={setWh2}
            wh3={wh3} setWh3={setWh3}
            wh4={wh4} setWh4={setWh4}
            ri={ri} setRi={setRi}
            dark={dark} setDark={setDark}
            isAdmin={isAdmin} setIsAdmin={setIsAdmin}
          />
        )}
        {tab === "review" && isAdmin && (
          <ReviewScreen wh3={wh3} wh4={wh4} dark={dark} onBack={() => setTab("home")} />
        )}
      </div>

      <NewsDrawer news={openedNews} onClose={() => setOpenedNews(null)} />

      {/* Bottom Navigation */}
      <div style={{
        height:64, background:"var(--bg-nav)", borderTop:"1px solid var(--border)",
        display:"flex", alignItems:"center", justifyContent:"space-around",
        padding:"0 10px max(10px, env(safe-area-inset-bottom))", flexShrink:0, zIndex:5
      }}>
        <button onClick={() => setTab("home")} style={{background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:tab==="home"?"#2563EB":"var(--txt-d)", fontFamily:"inherit"}}>
          <span style={{fontSize:20}}>🏠</span>
          <span style={{fontSize:10, fontWeight:tab==="home"?700:500}}>الأخبار</span>
        </button>

        <button onClick={() => setTab("analyse")} style={{background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:tab==="analyse"?"#7C3AED":"var(--txt-d)", fontFamily:"inherit"}}>
          <span style={{fontSize:20}}>🏛️</span>
          <span style={{fontSize:10, fontWeight:tab==="analyse"?700:500}}>التحاليل</span>
        </button>

        {isAdmin && (
          <button onClick={() => setTab("review")} style={{background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:tab==="review"?"#F59E0B":"var(--txt-d)", fontFamily:"inherit"}}>
            <span style={{fontSize:20}}>📋</span>
            <span style={{fontSize:10, fontWeight:tab==="review"?700:500}}>المراجعة</span>
          </button>
        )}

        <button onClick={() => setTab("notifications")} style={{background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:tab==="notifications"?"#DC2626":"var(--txt-d)", fontFamily:"inherit", position:"relative"}}>
          <span style={{fontSize:20}}>🔔</span>
          <span style={{fontSize:10, fontWeight:tab==="notifications"?700:500}}>التنبيهات</span>
          {urgentCount > 0 && (
            <div style={{position:"absolute", top:0, right:12, width:8, height:8, background:"#DC2626", borderRadius:"50%"}} />
          )}
        </button>

        <button onClick={() => setTab("saved")} style={{background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:tab==="saved"?"#F59E0B":"var(--txt-d)", fontFamily:"inherit"}}>
          <span style={{fontSize:20}}>🔖</span>
          <span style={{fontSize:10, fontWeight:tab==="saved"?700:500}}>المحفوظات</span>
        </button>

        <button onClick={() => setTab("settings")} style={{background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:tab==="settings"?"#64748B":"var(--txt-d)", fontFamily:"inherit"}}>
          <span style={{fontSize:20}}>⚙️</span>
          <span style={{fontSize:10, fontWeight:tab==="settings"?700:500}}>الإعدادات</span>
        </button>
      </div>
    </div>
  );
}

const rootElement = document.getElementById("root");
ReactDOM.render(<App />, rootElement);

// PWA Install prompt listener
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('install-banner');
  if (banner) banner.classList.remove('hidden');
});

document.getElementById('install-btn')?.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner')?.classList.add('hidden');
  }
});

document.getElementById('install-close')?.addEventListener('click', () => {
  document.getElementById('install-banner')?.classList.add('hidden');
});
</script>
</body>
</html>
